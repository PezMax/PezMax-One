[package]
name = "pezmax-one"
version = "1.0.0"
description = "PezMax - 高性能试卷资源管理桌面客户端 (egui + Metro Design)"
authors = ["Takahashi Rinta <mc1586182829@outlook.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/PezMax/PezMax-One"
homepage = "https://github.com/PezMax/PezMax-One"
readme = "README.md"
keywords = ["pdf", "exam", "education", "egui", "desktop"]
categories = ["gui", "education"]

[dependencies]
# GUI framework
egui = "0.31"
eframe = "0.31"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Image loading
image = "0.25"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# URL parsing
url = "2"

# 语义化版本比较（自动更新用）
semver = "1"

# Clipboard
arboard = "3"

# Base64
base64 = "0.22"

# File dialog
rfd = "0.15"

# ── PDF 预览 ──────────────────────────────────────────────
# pdfium-render = Chrome 同款 PDF 引擎，工业级渲染质量
# thread_safe：启用线程安全渲染，支持后台线程渲染
pdfium-render = { version = "0.8", features = ["thread_safe", "sync"] }

# ── 系统交互 ──────────────────────────────────────────────
# 用系统默认浏览器打开外部链接（书签等）
webbrowser = "1"

# ── 本地持久化 ────────────────────────────────────────────
# 跨平台数据目录（APPDATA / ~/.local/share / ~/Library）
dirs = "6"
# 本地下载记录持久化（SQLite）
# bundled: 编译 SQLite 静态库，避免用户机器需要安装 libsqlite3
rusqlite = { version = "0.31", features = ["bundled"] }
# 配置文件持久化（用户设置）
confy = "0.6"
# 本地凭证混淆用的 machine-uid
machine-uid = "0.5"
hostname = "0.4"


# ── Linux 系统菜单（Plasma Global Menu 集成） ───────────────
# zbus：纯 Rust D-Bus 客户端，实现 com.canonical.dbusmenu 服务
# wayland-client / wayland-backend：绑定 KWin 私有协议 org_kde_kwin_appmenu
# raw-window-handle：从 eframe CreationContext 拿 wl_display / wl_surface 原始指针
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-scanner = "0.31"
raw-window-handle = "0.6"

# ── macOS 系统菜单 ─────────────────────────────────────────
# muda：Tauri 出品的原生菜单 crate，macOS 走 NSMenu
# 关闭默认的 gtk/libxdo（那两个只在 Linux 有用）
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }

[build-dependencies]
# Windows resource compilation (icon embedding)
embed-resource = "3"
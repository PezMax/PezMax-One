[package]
name = "pezmax-egui"
version = "1.0.0"
description = "PezMax - 高性能试卷资源管理桌面客户端 (egui + Metro Design)"
authors = ["Takahashi Rinta <mc1586182829@outlook.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/PezMax/PezMax-One"
homepage = "https://github.com/PezMax/PezMax-One"
readme = "README.md"
keywords = ["pdf", "exam", "education", "egui", "desktop"]
categories = ["gui", "education"]

[dependencies]
# GUI framework
egui = "0.31"
eframe = "0.31"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Image loading
image = "0.25"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# URL parsing
url = "2"

# Clipboard
arboard = "3"

# Base64
base64 = "0.22"

# File dialog
rfd = "0.15"

# ── PDF 预览 ──────────────────────────────────────────────
# pdfium-render = Chrome 同款 PDF 引擎，工业级渲染质量
# thread_safe：启用线程安全渲染，支持后台线程渲染
pdfium-render = { version = "0.8", features = ["thread_safe", "sync"] }

# ── 系统交互 ──────────────────────────────────────────────
# 用系统默认浏览器打开外部链接（书签等）
webbrowser = "1"

# ── 本地持久化 ────────────────────────────────────────────
# 跨平台数据目录（APPDATA / ~/.local/share / ~/Library）
dirs = "6"
# 本地下载记录持久化（SQLite）
# bundled: 编译 SQLite 静态库，避免用户机器需要安装 libsqlite3
rusqlite = { version = "0.31", features = ["bundled"] }
# 配置文件持久化（用户设置）
confy = "0.6"
# 本地凭证混淆用的 machine-uid
machine-uid = "0.5"
hostname = "0.4"

[build-dependencies]
# Windows resource compilation (icon embedding)
embed-resource = "3"
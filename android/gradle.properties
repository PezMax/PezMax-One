# JVM 参数：Compose + 三个模块一起编，3G 是这台机器的安全值。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 36 早于 AGP 8.5 的官方支持范围；跟着 Kanesumi 的工具链走，先压掉警告。
android.suppressUnsupportedCompileSdk=36

# 默认后端地址（D13）：随构建写进 BuildConfig.DEFAULT_BASE_URL，设置里可改。
# 这里是开发/测试服务器；生产地址待负责人提供后只改这一行。
pezmax.baseUrl=http://82.156.245.102:9033
